name: Check and publish walkthrough

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check scientific model
        run: node --test tests/model.test.cjs
      - name: Check browser code
        run: |
          node --check web/model.js
          node --check web/app.js
      - name: Validate source and links
        run: python3 scripts/validate_site.py
      - name: Build static walkthrough
        run: python3 scripts/build_site.py
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages bundle
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: check-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish walkthrough
        id: deployment
        uses: actions/deploy-pages@v4
